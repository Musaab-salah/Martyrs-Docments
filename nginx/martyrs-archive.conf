server {
    listen 80;
    listen [::]:80;
    
    # Server name for domain
    server_name martyrssud.com www.martyrssud.com;
    
    # Temporary: Allow HTTP for Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /opt/Martyrs-Docments/client/build;
    }
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    # Server name for domain
    server_name martyrssud.com www.martyrssud.com;
    
    # SSL Certificate (temporary self-signed)
    ssl_certificate /etc/ssl/certs/martyrssud-temp.crt;
    ssl_certificate_key /etc/ssl/private/martyrssud-temp.key;
    
    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Serve static files from React build
    root /opt/Martyrs-Docments/client/build;
    index index.html;
    
    # Handle React routing
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public";
    }
    
    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # API proxy to backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
    
    # Handle uploads directory
    location /uploads/ {
        alias /opt/Martyrs-Docments/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
    
    # Deny access to backup files
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
    }
}